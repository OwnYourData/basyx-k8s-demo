apiVersion: apps/v1
kind: Deployment
metadata:
  name: aas-env
  namespace: basyx
  labels:
    app: aas-env
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aas-env
  template:
    metadata:
      labels:
        app: aas-env
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-aas-dir
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command: ["sh","-c","mkdir -p /application/aas/data && chmod 0777 /application/aas/data"]
          volumeMounts:
            - name: aas-data
              mountPath: /application/aas
      containers:
        - name: aas-env
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_PASSWORD
          image: eclipsebasyx/aas-environment:2.0.0-SNAPSHOT
          env:
            - name: SERVER_PORT
              value: "8081"
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /application/application.properties
              subPath: application.properties
            - name: aas-data
              mountPath: /application/aas
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: basyx-aas-env-config
            items:
              - key: application.properties
                path: application.properties
        - name: aas-data
          persistentVolumeClaim:
            claimName: aas-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: basyx
  labels:
    app: dashboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      containers:
        - name: dashboard-api
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_PASSWORD
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/workspace/config/          # garantiert, dass /workspace/config/application.yml geladen wird
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/dashboard"                     # Context-Path sicher aktiv, auch wenn ConfigMap mal nicht lädt
          image: aaronzi/basyx-dashboard-api:SNAPSHOT_02
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          volumeMounts:
            - name: config
              mountPath: /workspace/config/application.yml
              subPath: application.yml
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 65
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
      volumes:
        - name: config
          configMap:
            name: basyx-dashboard-api-config
            items:
              - key: application.yml
                path: application.yml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oas-proxy
  namespace: basyx
spec:
  replicas: 1
  selector:
    matchLabels: { app: oas-proxy }
  template:
    metadata:
      labels: { app: oas-proxy }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - name: cfg
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: cfg
          configMap:
            name: oas-proxy-nginx
