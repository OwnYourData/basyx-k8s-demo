apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: basyx
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aas-registry
  namespace: basyx
  labels:
    app: aas-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aas-registry
  template:
    metadata:
      labels:
        app: aas-registry
    spec:
      containers:
        - name: aas-registry
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: basyx-mongo-secret
                  key: MONGO_PASSWORD
          image: eclipsebasyx/aas-registry-log-mongodb:2.0.0-SNAPSHOT
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /workspace/config/application.yml
              subPath: application.yml
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: basyx-aas-registry-config
            items:
              - key: application.yml
                path: application.yml
---
