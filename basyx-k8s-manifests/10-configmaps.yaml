apiVersion: v1
kind: ConfigMap
metadata:
  name: basyx-aas-env-config
  namespace: basyx
data:
  application.properties: |
    server.port=8081
    # Context path & Forwarded headers
    server.servlet.context-path=/aas-env
    server.forward-headers-strategy=framework

    basyx.backend=MongoDB
    basyx.environment=file:aas/data
    basyx.cors.allowed-origins=*
    basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
    basyx.aasrepository.feature.registryintegration=http://aas-registry.basyx.svc.cluster.local:8080
    basyx.submodelrepository.feature.registryintegration=http://sm-registry.basyx.svc.cluster.local:8080
    # basyx.aasrepository.feature.registryintegration=false
    # basyx.submodelrepository.feature.registryintegration=false
    basyx.externalurl=https://basyx.data-container.net/aas-env

    spring.servlet.multipart.max-file-size=500MB
    spring.servlet.multipart.max-request-size=500MB

    spring.data.mongodb.host=mongo.basyx.svc.cluster.local
    spring.data.mongodb.database=aas-env
    spring.data.mongodb.authentication-database=admin
    spring.data.mongodb.username=${MONGO_USERNAME}
    spring.data.mongodb.password=${MONGO_PASSWORD}

    # >>> Swagger / OpenAPI korrekt auf Context-Path zeigen
    springdoc.api-docs.path=/v3/api-docs
    springdoc.swagger-ui.config-url=/aas-env/v3/api-docs/swagger-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: basyx-aas-registry-config
  namespace: basyx
data:
  application.yml: |
    server:
      servlet:
        context-path: /registry
      forward-headers-strategy: framework

    basyx:
      cors:
        allowed-origins: '*'
        allowed-methods: GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

    spring:
      data:
        mongodb:
          uri: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.basyx.svc.cluster.local:27017/?authSource=admin"

    # >>> Swagger / OpenAPI korrekt auf Context-Path zeigen
    springdoc:
      api-docs:
        path: /v3/api-docs
      swagger-ui:
        config-url: /registry/v3/api-docs/swagger-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: basyx-sm-registry-config
  namespace: basyx
data:
  application.yml: |
    server:
      servlet:
